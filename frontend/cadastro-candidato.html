<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Candidato</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="form-container">
    <h2>Novo Candidato</h2>
    <form id="formCandidato">
      <div class="form-group">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" class="input-form" required>
      </div>
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" class="input-form" required>
      </div>
      <div class="form-group">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" class="input-form" required>
      </div>
      <div class="form-group">
        <label for="idade">Idade</label>
        <input type="number" id="idade" class="input-form" required>
      </div>
      <div class="form-group">
        <label for="estado">Estado (UF)</label>
        <input type="text" id="estado" class="input-form" maxlength="2" placeholder="Ex: MA" required>
      </div>
      <div class="form-group">
        <label for="cep">CEP</label>
        <input type="text" id="cep" class="input-form" placeholder="Apenas números" required>
      </div>
      <div class="form-group">
        <label for="descricao">Descrição / Resumo Profissional</label>
        <textarea id="descricao" class="input-form" rows="3" required></textarea>
      </div>
      <div class="form-group">
        <label for="competencias">Competências (separadas por vírgula)</label>
        <input type="text" id="competencias" class="input-form" placeholder="Ex: Java, Spring, Vue" required>
      </div>
      <button type="submit" class="btn-submit" style="width: 100%;">Salvar Candidato</button>
    </form>
    <a href="/index.html" style="display: block; text-align: center; margin-top: 15px;">Voltar para Home</a>
  </div>
  <script type="module" src="/src/pages/cadastroCandidato/cadastroCandidato.ts"></script>
</body>
</html>
