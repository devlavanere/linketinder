<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Candidato</title>
  <link rel="stylesheet" href="/src/style.css">
  <style>
    .form-container { 
        max-width: 500px; 
        margin: 40px auto; 
        background: white; 
        padding: 30px; 
        border-radius: 8px; 
        box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
    }
    .form-group { 
        margin-bottom: 15px; 
    }
    label { 
        display: block; 
        font-weight: 
        bold; margin-bottom: 5px; 
    }
    input, textarea { 
        width: 100%; 
        padding: 10px; 
        border: 1px solid #ccc; 
        border-radius: 4px; 
        box-sizing: border-box; 
    }
    .btn-submit { 
        width: 100%; 
        padding: 12px; 
        background: #007bff; 
        color: white; 
        border: none; 
        border-radius: 4px; cursor: 
        pointer; font-size: 16px; 
        font-weight: bold; 
    }
    .btn-submit:hover { 
        background: #0056b3; 
    }
  </style>
</head>
<body>
  
  <div class="form-container">
    <h2>Wizard: Novo Candidato</h2>
    
    <!-- O ID para pegar o envio dos dados -->
    <form id="formCandidato">
      
      <!-- ID único para cada input para capturar o valor individualmente no TS -->
      <div class="form-group">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" required>
      </div>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" required>
      </div>

      <div class="form-group">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" required>
      </div>

      <div class="form-group">
        <label for="idade">Idade</label>
        <input type="number" id="idade" required>
      </div>

      <!-- Captura competências como texto e tratar no TS para serem usadas no gráfico. -->
      <div class="form-group">
        <label for="competencias">Competências (separadas por vírgula)</label>
        <input type="text" id="competencias" placeholder="Ex: Java, Spring, Vue" required>
      </div>

      <button type="submit" class="btn-submit">Salvar Candidato</button>
    </form>
    
    <a href="/index.html" style="display: block; text-align: center; margin-top: 15px;">Voltar para Home</a>
  </div>

  <!-- Importa o TypeScript diretamente no HTML como um módulo -->
  <script type="module" src="/src/pages/cadastroCandidato.ts"></script>
</body>
</html>
