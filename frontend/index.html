<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Linketinder - Home</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; text-align: center; }
    .container { max-width: 600px; margin: 50px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .btn { display: inline-block; padding: 10px 20px; margin: 10px; text-decoration: none; color: white; background: #007bff; border-radius: 5px; font-weight: bold; }

  </style>
</head>
<body>
  <div class="container">
    <h1>Linketinder</h1>
    <p>O match perfeito entre a sua carreira e as melhores empresas.</p>
    
    <div style="margin: 30px 0;">
      <a href="/login.html" class="btn btn-login">Fazer Login</a>
    </div>

    <hr style="margin: 30px 0; border: 1px solid #eee;">

    <div>
      <h3>Ainda não tem conta?</h3>
      <a href="/cadastro-candidato.html" class="btn">Cadastrar como Candidato</a>
      <a href="/cadastro-empresa.html" class="btn btn-empresa">Cadastrar como Empresa</a>
    </div>
  </div>

</html>
