<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Empresa</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="form-container">
    <h2>Nova Empresa</h2>
    <form id="formEmpresa">
      <div class="form-group">
        <label for="nome">Nome da Empresa</label>
        <input type="text" id="nome" class="input-form" required>
      </div>
      <div class="form-group">
        <label for="email">E-mail Corporativo</label>
        <input type="email" id="email" class="input-form" required>
      </div>
      <div class="form-group">
        <label for="cnpj">CNPJ</label>
        <input type="text" id="cnpj" class="input-form" required>
      </div>
      <div class="form-group">
        <label for="pais">País</label>
        <input type="text" id="pais" class="input-form" required>
      </div>
      <div class="form-group">
        <label for="estado">Estado (UF)</label>
        <input type="text" id="estado" class="input-form" maxlength="2" required>
      </div>
      <div class="form-group">
        <label for="cep">CEP</label>
        <input type="text" id="cep" class="input-form" required>
      </div>
      <div class="form-group">
        <label for="descricao">Descrição da Empresa</label>
        <textarea id="descricao" class="input-form" rows="3" required></textarea>
      </div>
      <div class="form-group">
        <label for="competencias">Tecnologias utilizadas (separadas por vírgula)</label>
        <input type="text" id="competencias" class="input-form" placeholder="Ex: Java, Python, Vue.js" required>
      </div>
      <button type="submit" class="btn-submit btn-empresa" style="width: 100%;">Salvar Empresa</button>
    </form>
    <a href="/index.html" style="display: block; text-align: center; margin-top: 15px;">Voltar para Home</a>
  </div>
  <script type="module" src="/src/pages/cadastroEmpresa/cadastroEmpresa.ts"></script>
</body>
</html>
