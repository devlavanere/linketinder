<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Vagas Disponíveis</title>
  <link rel="stylesheet" href="/src/style.css">
  <style>
    .vagas-container { 
        max-width: 900px; 
        margin: 40px auto; 
        padding: 20px; 
    }
    .vagas-grid { 
        display: flex; 
        flex-direction: 
        column; gap: 20px; 
        margin-top: 20px; 
    }
    
    .card-vaga { 
        background: white; 
        padding: 20px; 
        border-radius: 8px; 
        box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
        border-left: 5px solid #007bff; 
    }
    .card-vaga h3 { 
        margin-top: 0; 
        color: #333; 
    }
    .empresa-anonima { 
        font-size: 14px; 
        color: #6c757d; 
        font-weight: bold; 
        margin-bottom: 10px; 
    }
    
    .tags { 
        display: flex; 
        flex-wrap: wrap; 
        gap: 5px; 
        margin-top: 15px; 
    }
    .tag { 
        background: #e9ecef;
        padding: 3px 8px; 
        border-radius: 12px; 
        font-size: 12px; 
        font-weight: bold; 
        color: #333; 
    }
    .btn-match { 
        margin-top: 15px; 
        background: #007bff; 
        color: white; 
        border: none; 
        padding: 8px 15px; 
        border-radius: 4px; 
        cursor: pointer; 
        font-weight: bold; 
    }
    .btn-match:hover { 
        background: #0056b3; 
    }
  </style>
</head>
<body>

  <div class="vagas-container">
    <h2>Mural de Vagas</h2>
    <a href="/index.html" style="display: inline-block; margin-bottom: 20px;">← Voltar para Home</a>

    <!-- TYPESCRIPT VAI INJETA AS VAGAS -->
    <div class="vagas-grid" id="lista-vagas">
      <!-- O TS preencherá dinamicamente -->
    </div>
  </div>

  <script type="module" src="/src/pages/vagas.ts"></script>
</body>
</html>
