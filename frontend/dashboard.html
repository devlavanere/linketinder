<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard da Empresa</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="dashboard-container">
    <h2>Visão Geral: Candidatos</h2>
    
    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
      <button onclick="fazerLogout()" class="btn" style="background: #6c757d;">Sair (Logout)</button>
      <button onclick="deletarMinhaConta()" class="btn-delete">Excluir Minha Conta</button>
    </div>

    <div style="margin-bottom: 40px;">
        <h3>Vagas que eu publiquei</h3>
        <div id="lista-vagas-proprias"></div>
    </div>
    
    <a href="/index.html" style="display: inline-block; margin-bottom: 20px; color: #666; text-decoration: none;">← Voltar para Home</a>

    <div class="grafico-container" style="margin-bottom: 40px; border-left: 5px solid #28a745;">
      <h3>Publicar Nova Vaga</h3>
      <form id="formVaga" style="display: flex; flex-direction: column; gap: 10px;">
        <div>
          <label for="tituloVaga" style="font-weight: bold; font-size: 14px;">Título da Vaga</label>
          <input type="text" id="tituloVaga" class="input-form" placeholder="Ex: Desenvolvedor Frontend Júnior" required>
        </div>
        <div>
          <label for="descricaoVaga" style="font-weight: bold; font-size: 14px;">Descrição da Vaga</label>
          <textarea id="descricaoVaga" class="input-form" rows="2" placeholder="O que o candidato fará?" required></textarea>
        </div>
        <div>
          <label for="competenciasVaga" style="font-weight: bold; font-size: 14px;">Competências Exigidas (separadas por vírgula)</label>
          <input type="text" id="competenciasVaga" class="input-form" placeholder="Ex: TypeScript, Vue.js, Docker" required>
        </div>
        <button type="submit" class="btn btn-empresa">Publicar Vaga</button>
      </form>
    </div>

    <div class="candidatos-grid" id="lista-candidatos">
      <!-- TS preenche dinamicamente. -->
    </div>

    <div class="grafico-container">
      <h3>Competências mais populares</h3>
      <canvas id="graficoCompetencias"></canvas>
    </div>
  </div>

  <script type="module" src="/src/pages/dashboard/dashboard.ts"></script>
</body>
</html>
