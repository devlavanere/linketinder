<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Recrutador</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="form-container">
    <h2>Novo Recrutador</h2>
    <form id="form-recrutador">
      <div class="form-group">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" class="input-form" required>
      </div>
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" class="input-form" required>
      </div>
      <div class="form-group">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" class="input-form" required>
      </div>
      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" class="input-form" required>
      </div>
      <div class="form-group">
        <label for="dataNascimento">Data de Nascimento</label>
        <input type="date" id="dataNascimento" class="input-form" required>
      </div>
      <div class="form-group">
        <label for="areaRecrutamento">Área de Recrutamento</label>
        <input type="text" id="areaRecrutamento" class="input-form" placeholder="Ex: Engenharia de Software" required>
      </div>
      <div class="form-group">
        <label for="descricao">Descrição / Resumo Profissional</label>
        <textarea id="descricao" class="input-form" rows="3" required></textarea>
      </div>
      <button type="submit" class="btn-submit" style="width: 100%;">Salvar Recrutador</button>
    </form>
    <a href="/dashboard.html" style="display: block; text-align: center; margin-top: 15px;">Voltar para Dashboard</a>
  </div>
  <script type="module" src="/src/pages/cadastroRecrutador/cadastroRecrutador.ts"></script>
</body>
</html>
