<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login - Linketinder</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="container" style="max-width: 400px; text-align: center;">
    <h2>Entrar no Linketinder</h2>
    <form id="formLogin">
      <label style="text-align: left; display: block; font-weight: bold;">Seu E-mail</label>
      <input type="email" id="emailLogin" class="input-form" placeholder="Digite o e-mail cadastrado" required>
      <button type="submit" class="btn" style="width: 100%;">Entrar</button>
    </form>
    <a href="/index.html" style="display: block; margin-top: 15px; color: #666; text-decoration: none;">← Voltar para Home</a>
  </div>
  <script type="module" src="/src/pages/login/login.ts"></script>
</body>
</html>
