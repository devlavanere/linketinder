<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login - Linketinder</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
    .container { max-width: 400px; margin: 50px auto; background: white; padding: 30px; border-radius: 10px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    input { width: 100%; padding: 10px; margin: 15px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;}
    .btn { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold;}
    .btn:hover { background: #0056b3; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Entrar no Linketinder</h2>
    <form id="formLogin">
      <label style="text-align: left; display: block; font-weight: bold;">Seu E-mail</label>
      <input type="email" id="emailLogin" placeholder="Digite o e-mail cadastrado" required>
      <button type="submit" class="btn">Entrar</button>
    </form>
    <a href="/index.html" style="display: block; margin-top: 15px; color: #666;">← Voltar para Home</a>
  </div>
  <script type="module" src="/src/pages/login.ts"></script>
</body>
</html>
